# Runs Forge and its local Postgres database for development.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
    ports:
      - "5432:5432"
    volumes:
      - forge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POLLING_API_KEY: ${POLLING_API_KEY:?Set POLLING_API_KEY in .env}
      BANK_BASE_URL: ${BANK_BASE_URL:?Set BANK_BASE_URL in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env using host db for Docker}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
    ports:
      - "8000:8000"

volumes:
  forge_pgdata:
